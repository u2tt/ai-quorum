[project]
name = "ai-quorum"
version = "0.1.0"
description = "多模型 AI 圆桌讨论：让不同大模型就同一议题互相辩论并收敛出结论"
readme = "README.md"
authors = [
    { name = "u2tt" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["llm", "multi-agent", "debate", "fastapi", "openai-compatible"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aiq = "quorum.cli:main"
debate = "quorum.webapp:main"
debate-cli = "quorum.debate:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quorum"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
